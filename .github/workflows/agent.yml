# Runs the Passpot agent every 5 minutes: it closes rounds whose time is up and
# keeps a live demo circle ready. Needs two repository secrets:
#   ROTA_URL     e.g. https://rota.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET on Vercel
name: Passpot agent
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the agent
        env:
          ROTA_URL: ${{ secrets.ROTA_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 90 -X POST "$ROTA_URL/api/agent" \
            -H "Authorization: Bearer $CRON_SECRET" | tee result.json
          grep -q '"ok":true' result.json
